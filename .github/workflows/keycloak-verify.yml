name: Kiểm chứng cấp phát Keycloak

# Workflow riêng cho thư mục keycloak/: dựng Keycloak 26.8.1 sạch
# bằng stack kiểm chứng (keycloak/verify/compose.verify.yaml) rồi
# chạy bộ kiểm chứng keycloak/verify/verify.mjs — cấp phát một
# realm giaokhoa duy nhất với 2 Organization mẫu từ môi trường
# trống, đối chiếu cấu trúc realm, permission FGAP, claim
# organization trong token và ma trận quản trị của admin trung
# tâm, kiểm chứng realm master giữ mặc định, rồi chạy lại bộ cấp
# phát để chứng minh không trùng và không mất bí mật.
# Workflow này không thay job verify/verify-stack của cổng merge
# vào main; nó là kiểm chứng chuyên biệt cho việc cấp phát
# Keycloak và chỉ chạy khi thư mục keycloak/ thay đổi hoặc khi
# được gọi tay.

on:
  pull_request:
    paths:
      - "keycloak/**"
      - ".github/workflows/keycloak-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keycloak-verify:
    runs-on: ubuntu-latest
    env:
      # Giá trị chỉ dành cho môi trường kiểm chứng dùng một lần
      # trên runner: khớp với stack trong compose.verify.yaml,
      # không phải bí mật của môi trường thật.
      KC_BASE_URL: http://localhost:8180
      KC_ADMIN_USERNAME: localadmin
      KC_ADMIN_PASSWORD: verify-admin-password
      PROVISION_CONFIG: keycloak/verify/provision.config.verify.json
      LMS_WEB_SECRET: verify-web-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dựng stack Keycloak kiểm chứng
        run: docker compose -f keycloak/verify/compose.verify.yaml up -d

      - name: Chờ Keycloak sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8180/realms/master > /dev/null; then
              echo "Keycloak đã sẵn sàng"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak không sẵn sàng sau 5 phút"
          docker compose -f keycloak/verify/compose.verify.yaml logs
          exit 1

      - name: Chạy bộ kiểm chứng cấp phát
        run: node keycloak/verify/verify.mjs

      - name: Dọn stack kiểm chứng
        if: always()
        run: docker compose -f keycloak/verify/compose.verify.yaml down -v
