name: server-test

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: Open the test-pg bridge and wait for its port
        run: |
          cloudflared access tcp --hostname test-pg.fuckr.net --url 127.0.0.1:5434 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5434) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "test-pg bridge is ready on 127.0.0.1:5434"
              exit 0
            fi
            sleep 2
          done
          echo "::error::test-pg bridge did not become ready within 60 seconds"
          cat "$RUNNER_TEMP/cloudflared.log"
          exit 1
      - name: Run apps/server tests
        working-directory: apps/server
        env:
          LMS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5434
          LMS_TEST_PG_USER: testpg
          LMS_TEST_PG_PASSWORD: ${{ secrets.LMS_TEST_PG_PASSWORD }}
        run: ./mvnw -B -ntp test
