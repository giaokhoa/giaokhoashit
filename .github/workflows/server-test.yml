name: server-test

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run apps/server tests
        working-directory: apps/server
        env:
          LMS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432
          LMS_TEST_PG_USER: postgres
          LMS_TEST_PG_PASSWORD: postgres
        run: ./mvnw -B -ntp test
