# Stack kiểm chứng ĐỘC LẬP cho việc cấp phát Keycloak (issue #31).
#
# Chỉ dùng cho kiểm chứng tự động (keycloak/verify/verify.mjs) trên
# máy dev hoặc CI — KHÔNG dùng cho triển khai thật:
# - Mọi thông tin đăng nhập trong file này là giá trị dùng một lần
#   cho môi trường kiểm chứng, cố ý đặt ngay trong file để stack
#   chạy được không cần cấu hình thêm; chúng không bảo vệ dữ kiện
#   nào có giá trị và không được mang sang môi trường thật.
# - Keycloak chạy với cơ sở dữ liệu PostgreSQL riêng của stack,
#   dữ liệu nằm trong volume kc-verify-db-data của stack này;
#   xoá volume là quay về môi trường trống để kiểm chứng cấp phát
#   từ đầu.
# - Tính năng thử nghiệm resource-indicators (RFC 8707) được bật
#   bằng --features=resource-indicators để kiểm chứng đúng hành vi
#   của Keycloak 26.8.1; compose.yaml của stack thật KHÔNG bật cờ
#   này (quyết định bật ở production thuộc việc tích hợp MCP).
#
# Cách chạy (từ thư mục gốc của repo):
#   docker compose -f keycloak/verify/compose.verify.yaml up -d
#   # chờ http://localhost:8180/realms/master trả 200 rồi:
#   PROVISION_CONFIG=keycloak/verify/provision.config.verify.json \
#   KC_BASE_URL=http://localhost:8180 \
#   KC_ADMIN_USERNAME=localadmin \
#   KC_ADMIN_PASSWORD=verify-admin-password \
#   LMS_WEB_SECRET=verify-web-secret \
#   node keycloak/verify/verify.mjs

services:
  kc-verify-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: verify-db-password
    volumes:
      - kc-verify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak-verify:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --features=resource-indicators
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-verify-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: verify-db-password
      KC_BOOTSTRAP_ADMIN_USERNAME: localadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: verify-admin-password
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      kc-verify-db:
        condition: service_healthy

volumes:
  kc-verify-db-data:
