# compose.keycloak.yaml ở gốc repo — stack Keycloak RIÊNG, tách
# khỏi stack ứng dụng trong compose.yaml. Keycloak là nền xác
# thực độc lập, có chu kỳ deploy riêng: dựng một lần rồi để yên,
# để các lần deploy ứng dụng không còn đường nào đụng vào
# Keycloak — đặc biệt là bind theme ./keycloak/themes, vốn từng
# trỏ vào thư mục deploy bị tạo lại sau mỗi lần deploy của
# stack ứng dụng và làm theme biến mất khi container keycloak
# không được tạo lại.
#
# Cách dùng (trên nền tảng quản lý như Dokploy: một stack riêng
# trỏ Compose Path vào đúng file này, cùng thư mục gốc repo):
#   docker compose -f compose.keycloak.yaml up -d
#
# Dữ kiện của kc-db nằm trong volume external khai ở cuối file:
# volume sẵn có của stack ứng dụng cũ trên host, stack này chỉ
# gắn vào đúng volume đó — không tạo volume mới, không di
# chuyển dữ liệu.

services:
  # Keycloak — nền xác thực tập trung của hệ thống (issue #704):
  # Keycloak quản lý danh tính, organization và gán vai cấp
  # trung tâm; app phân giải và thực thi capability nghiệp vụ
  # theo ngữ cảnh. Hai service dưới đây là toàn bộ stack riêng
  # này — không service ứng dụng nào phụ thuộc vào chúng qua
  # mạng nội bộ nên hành vi của các service ứng dụng không đổi.
  #
  # Dữ kiện danh tính của Keycloak (realm, người dùng,
  # organization) nằm trong PostgreSQL RIÊNG của nó (service
  # kc-db ngay dưới) trên volume có tên keycloak-db-data — không
  # dùng chung cụm Postgres của ứng dụng và không được mất khi
  # container bị tạo lại ở các lần deploy.
  #
  # Realm, client và cấu hình trong realm được tạo tay trong
  # Admin Console — repo không giữ mẫu realm hay bộ cấp phát
  # bằng code; thư mục keycloak/ chỉ giữ login theme, xem
  # keycloak/README.md. Service keycloak dưới đây chạy thẳng
  # image gốc của Keycloak và không tự nạp realm lúc khởi
  # động: sau khi stack lên (kể cả khi cơ sở dữ liệu của
  # Keycloak bị xoá sạch và dựng lại từ đầu), vận hành tạo lại
  # cấu trúc realm trong Admin Console.
  #
  # Hai service này chạy trên mạng riêng keycloak-net (khai ở
  # khối networks cuối file), tách khỏi mạng mặc định của
  # stack: kc-db chỉ cần nói chuyện với keycloak, và các
  # container của ứng dụng không còn đường mạng nội bộ nào
  # tới Keycloak.
  kc-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # Một biến bí mật duy nhất cho cả hai phía của cùng một
      # mật khẩu: POSTGRES_PASSWORD ở đây (phía server) và
      # KC_DB_PASSWORD của service keycloak (phía client) cùng
      # nội suy từ KEYCLOAK_DB_PASSWORD của môi trường triển
      # khai.
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Can dat KEYCLOAK_DB_PASSWORD trong file .env}
    volumes:
      # PostgreSQL 17 giữ bố cục thư mục dữ kiện cổ điển
      # /var/lib/postgresql/data — khác service postgres của
      # stack (PostgreSQL 18, mount tại /var/lib/postgresql).
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - keycloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Can dat KEYCLOAK_DB_PASSWORD trong file .env}
      # Tài khoản quản trị BOOTSTRAP của Keycloak: tài khoản
      # quản trị thuộc realm master với quyền quản trị đầy đủ
      # (không chỉ quyền vào Admin Console), được Keycloak tạo
      # ở lần khởi động đầu tiên trên cơ sở dữ liệu trống từ
      # mật khẩu nội suy ở đây. Đây là tài khoản TẠM của lần
      # dựng đầu: KEYCLOAK_ADMIN_PASSWORD cần có ở lần deploy
      # đầu tiên để bootstrap tạo được tài khoản; sau khi đã
      # có tài khoản quản trị lâu dài thì xoá tài khoản tạm
      # này và gỡ biến khỏi môi trường triển khai theo quy
      # trình kết thúc bootstrap ở mục nghiệm thu của
      # issue #704.
      #
      # Chỉ mật khẩu được khai ở đây; tên tài khoản bootstrap
      # TUYỆT ĐỐI không ghim trong compose. Keycloak kiểm
      # chứng cặp tuỳ chọn này ngay ở bước kiểm chứng cấu
      # hình của lệnh start: tên tài khoản bootstrap chỉ hợp
      # lệ khi mật khẩu bootstrap đang được đặt, và tên đến
      # từ biến môi trường là giá trị người dùng sửa được nên
      # điều kiện kiểm chứng đó có chạy. Ghim tên tài khoản
      # trong khi mật khẩu là biến tuỳ chọn khiến lần khởi
      # động đầu tiên sau khi biến mật khẩu bị gỡ chết tại
      # bước kiểm chứng (PropertyException
      # "bootstrap-admin-username available only when
      # bootstrap admin password is set", tiến trình thoát
      # mã 2, container restart lặp vô hạn — sự cố
      # production ngày 02/11/2026, issue #724). Không ghim
      # tên thì giá trị mặc định `temp-admin` của Keycloak
      # không qua điều kiện kiểm chứng đó, nên lỗi không xảy
      # ra ở mọi trạng thái của biến mật khẩu; riêng dòng mật
      # khẩu không gắn điều kiện kiểm chứng nào nên đứng một
      # mình vẫn an toàn. Nội suy mật khẩu dùng dạng
      # ${...:-} (mặc định rỗng) thay cho dạng bắt buộc
      # ${...:?} để việc gỡ biến sau khi kết thúc bootstrap
      # không chặn deploy — khẳng định này chỉ đúng khi tên
      # tài khoản không bị ghim như trên.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Địa chỉ công khai duy nhất của Keycloak: trình duyệt
      # chỉ gặp Keycloak qua tên miền này (Cloudflare Tunnel
      # trỏ auth.fuckr.net về cổng host 8085 ở dưới), nên issuer
      # trong token luôn mang tiền tố
      # https://auth.fuckr.net/realms/.
      KC_HOSTNAME: https://auth.fuckr.net
      # TLS kết thúc ở Cloudflare Tunnel phía trước; container
      # chỉ nhận HTTP nội bộ và tin các header X-Forwarded-*.
      # Biên tin cậy của việc tin header này: từ ngoài host,
      # cổng 8085 ở dưới bị bind vào loopback nên chỉ
      # cloudflared chạy ngay trên host mới tới được cổng; từ
      # trong stack, keycloak đã tách sang mạng riêng
      # keycloak-net nên các container của ứng dụng không còn
      # đường mạng nội bộ nào tới keycloak:8080; tiến trình
      # chạy ngay trên host vốn thuộc biên tin cậy của host.
      # Vì vậy vẫn không đặt KC_PROXY_TRUSTED_ADDRESSES: chưa
      # có bằng chứng về địa chỉ peer mà container thật sự
      # nhìn thấy phía sau docker proxy trên mạng riêng — địa
      # chỉ đó sẽ đối chiếu từ log của Keycloak ở bước nghiệm
      # thu hậu merge trước khi quyết định có ghim hay không.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Bật thêm endpoint metrics trên cùng cổng quản trị 9000:
      # readiness (/health/ready) khi đó kiểm cả connection
      # pool tới kc-db, nên healthcheck ở dưới phản ánh đúng
      # việc Keycloak đã dùng được database của nó. Cổng 9000
      # không publish ra host — chỉ healthcheck trong container
      # và vận hành qua exec mới dùng tới.
      KC_METRICS_ENABLED: "true"
    ports:
      # Cổng host dành riêng cho Keycloak, bind vào loopback
      # (127.0.0.1) thay vì mọi giao diện của host: Cloudflare
      # Tunnel chạy ngay trên host và ingress của nó trỏ vào
      # cổng này trên localhost, nên bind loopback là đủ cho đường công
      # khai qua auth.fuckr.net, đồng thời không ai ngoài chính
      # host vào thẳng được cổng này để vượt qua tunnel hay giả
      # mạo các header X-Forwarded-* mà Keycloak tin
      # (KC_PROXY_HEADERS ở trên). Web vẫn là cửa vào của ứng
      # dụng như trước.
      # Số cổng phía host lấy từ biến KEYCLOAK_HOST_PORT của môi
      # trường triển khai, mặc định 8085 — cùng khuôn với
      # WEB_PORT của service web ở trên: một cổng host chỉ một
      # stack giữ được, nên các stack nhân bản từ compose này
      # (chẳng hạn preview theo nhánh) phải đặt cổng riêng qua
      # biến này trong môi trường của service trên Dokploy;
      # production không đặt biến nên vẫn dùng 8085 như trước,
      # và ingress của tunnel phải trỏ đúng cổng mà stack của
      # nó dùng.
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8085}:8080"
    depends_on:
      kc-db:
        condition: service_healthy
    healthcheck:
      # Image Keycloak không có curl: thăm readiness bằng Bash
      # /dev/tcp — mở kết nối TCP tới cổng quản trị 9000, gửi
      # request HTTP và đòi dòng trạng thái đáp án chứa 200.
      # start_period dài để lần khởi động đầu (tạo schema)
      # không bị tính là lỗi. Healthcheck chỉ để
      # quan sát trạng thái và cho CI chờ readiness — không cơ
      # chế nào restart container theo healthcheck, nên
      # database chập chờn không làm Keycloak bị khởi động lại.
      # Biến $status của shell trong lệnh dưới đây PHẢI viết
      # thành $$status: Compose nội suy mọi $... ngay trong
      # chuỗi lệnh của healthcheck, viết một $ thì biến bị thay
      # bằng chuỗi rỗng trước khi lệnh tới container và probe
      # hỏng lặng lẽ (đã vấp ở lượt CI đầu của healthcheck này:
      # log job có cảnh báo "status variable is not set" trong
      # khi Keycloak khởi động hoàn toàn bình thường).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1; printf "GET /health/ready HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3; IFS= read -r status <&3; case "$$status" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - keycloak-net
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro

volumes:
  # Dữ kiện PostgreSQL riêng của Keycloak (issue #704) — xem
  # service kc-db trong khối services. Volume khai external:
  # dữ liệu Keycloak hiện hữu nằm trong volume
  # gio-khoa-lms-mdthi2_keycloak-db-data trên host (tên theo quy
  # tắc <tên project>_<tên volume> của Docker Compose, project
  # là stack ứng dụng cũ gio-khoa-lms-mdthi2), stack này chỉ gắn
  # vào đúng volume đó. Theo Compose Specification, volume
  # external đã tồn tại sẵn và vòng đời do bên ngoài quản lý:
  # Compose không tạo mới và báo lỗi nếu volume không tồn tại,
  # còn thuộc tính name được dùng nguyên văn, không gắn tiền tố
  # tên project. Tên volume phải được kiểm chứng trực tiếp trên
  # host trước lần deploy đầu của stack này; nếu tên thật khác
  # thì sửa đúng dòng name dưới đây.
  keycloak-db-data:
    external: true
    name: gio-khoa-lms-mdthi2_keycloak-db-data

networks:
  # Mạng riêng của cặp Keycloak (issue #704): chỉ kc-db và
  # keycloak thuộc mạng này, và cả hai rời mạng mặc định của
  # stack — kc-db không lộ diện với các container của ứng
  # dụng, keycloak trên mạng nội bộ chỉ còn nhận kết nối từ
  # kc-db, cộng cổng loopback đã publish cho Cloudflare
  # Tunnel trên host. Các service hiện hữu không khai
  # networks nên vẫn ở mạng mặc định như trước.
  keycloak-net:
