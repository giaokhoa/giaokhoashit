spring.application.name=server

# Issuer của realm giaokhoa trên Keycloak: bắt buộc truyền qua biến môi trường,
# không ghi sẵn địa chỉ của bất kỳ môi trường nào trong file này.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}

# Access token phải mang aud là client lms-api của chính server này (audience mapper phía Keycloak đưa vào token);
# token phát cho client khác bị từ chối 401 như mọi token không hợp lệ khác.
spring.security.oauth2.resourceserver.jwt.audiences=lms-api

# Datasource PostgreSQL do Spring Boot tự cấu hình từ các biến môi trường SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD; Flyway tự chạy các script trong db/migration
# khi ứng dụng khởi động. Không ghi sẵn địa chỉ của bất kỳ môi trường nào trong file này.
# Schema do Flyway sở hữu duy nhất nên Hibernate không được tự tạo/sửa bảng theo entity.
spring.jpa.hibernate.ddl-auto=none

# Migration riêng theo vendor (RLS và role runtime là cơ chế của riêng PostgreSQL) nằm ở thư mục ngang cấp mang
# tên vendor tương ứng; Flyway tự thay {vendor} bằng tên database đang chạy. Thư mục vendor phải ngang cấp chứ
# không lồng trong db/migration, vì Flyway quét đệ quy thư mục migration và sẽ chạy cả migration của vendor khác.
spring.flyway.locations=classpath:db/migration,classpath:db/vendors/{vendor}

# Mật khẩu của role runtime lms_server_app do migration tạo: truyền qua biến môi trường của stack, cùng khuôn
# biến bí mật của datasource. Chỉ migration PostgreSQL dùng giá trị này.
spring.flyway.placeholders.lms-server-app-password=${SERVER_DB_APP_PASSWORD:}

# Bật hai nhóm health liveness/readiness tại /actuator/health/liveness và
# /actuator/health/readiness cho hạ tầng thăm dò.
management.endpoint.health.probes.enabled=true
