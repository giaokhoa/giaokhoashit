spring.application.name=server

# Issuer của realm giaokhoa trên Keycloak: bắt buộc truyền qua biến môi trường,
# không ghi sẵn địa chỉ của bất kỳ môi trường nào trong file này.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}

# Access token phải mang aud là client lms-api của chính server này (audience mapper phía Keycloak đưa vào token);
# token phát cho client khác bị từ chối 401 như mọi token không hợp lệ khác.
spring.security.oauth2.resourceserver.jwt.audiences=lms-api

# Service account chỉ đọc của client lms-api: các quyết định ghi thực hiện một lần trong lát tổ chức dạy học
# (đặt giáo viên, ghi danh) và các bản đọc định danh Organization đối chiếu dữ kiện hiện hành tại Keycloak qua
# Admin REST API bằng secret này. Secret truyền qua biến môi trường của stack. Ngữ cảnh request không dùng
# secret này: ngữ cảnh quyết theo claim organization của token đã kiểm chứng.
app.keycloak.membership.client-secret=<redacted>

# Datasource PostgreSQL do Spring Boot tự cấu hình từ các biến môi trường SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD; Flyway tự chạy các script trong db/migration
# khi ứng dụng khởi động. Không ghi sẵn địa chỉ của bất kỳ môi trường nào trong file này.
# Schema do Flyway sở hữu duy nhất nên Hibernate không được tự tạo/sửa bảng theo entity.
spring.jpa.hibernate.ddl-auto=none

# Migration riêng của PostgreSQL (RLS và role runtime là cơ chế chỉ PostgreSQL có) nằm ở thư mục vendor tương ứng
# và được liệt kê tường minh ở đây, không dùng placeholder {vendor} của Flyway: dạng placeholder buộc Spring Boot
# mở một kết nối qua datasource runtime chỉ để dò loại database TRƯỚC khi Flyway chạy, mà trên database trống role
# runtime chưa tồn tại (chính migration mới tạo role đó) nên ứng dụng không khởi động được ở lần deploy đầu. Bộ
# test H2 ghi đè locations chỉ còn db/migration trong cấu hình test của nó.
spring.flyway.locations=classpath:db/migration,classpath:db/vendors/postgresql

# Mật khẩu của role runtime lms_server_app do migration tạo: truyền qua biến môi trường của stack, cùng khuôn
# biến bí mật của datasource. Chỉ migration PostgreSQL dùng giá trị này.
spring.flyway.placeholders.lms-server-app-password=${SERVER_DB_APP_PASSWORD:}

# Bật hai nhóm health liveness/readiness tại /actuator/health/liveness và
# /actuator/health/readiness cho hạ tầng thăm dò.
management.endpoint.health.probes.enabled=true

# Tắt Open EntityManager in View: lát soạn đề làm việc trên nhiều phân vùng trong cùng một request, mỗi phân
# vùng phải là một phiên JPA riêng với tenant id riêng; một EntityManager dùng chung cho cả request sẽ đóng
# băng tenant theo ngữ cảnh đầu tiên và ghi hàng sang sai phân vùng. Mọi truy cập dữ kiện của server đều nằm
# trong giao dịch tường minh của service.
spring.jpa.open-in-view=false
